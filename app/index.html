<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Strip — GTA 6-style Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Sunset Strip</h1>
  <p>Turn a photo and a caption into GTA 6-style cover art. Works offline — your photos never leave this machine.</p>
</header>
<main>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
  <section class="controls">
    <label class="field">Title
      <input id="title" type="text" value="SUNSET HEIST" maxlength="40">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" value="VICE CITY" maxlength="40">
    </label>
    <fieldset class="size-pick">
      <legend>Post size</legend>
      <label><input type="radio" name="size" value="square" checked> Square 1080 &times; 1080</label>
      <label><input type="radio" name="size" value="portrait"> Portrait 1080 &times; 1350</label>
      <label><input type="radio" name="size" value="landscape"> Landscape 1920 &times; 1080</label>
    </fieldset>
    <div id="panels"></div>
    <div class="export">
      <button type="button" data-export="square">Export square PNG</button>
      <button type="button" data-export="portrait">Export portrait PNG</button>
      <button type="button" data-export="landscape">Export landscape PNG</button>
    </div>
    <p class="note">Tip: load a photo into each panel, drag the zoom and pan sliders to frame it, then export the size you want to post.</p>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
