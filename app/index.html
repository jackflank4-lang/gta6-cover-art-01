<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon Skyline — GTA 6 Cover Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Neon Skyline</h1>
  <p>Turn your photo and a caption into GTA-style cover art — three neon panels, one export.</p>
</header>
<main>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
  <section class="controls">
    <label class="field">Title
      <input id="title" type="text" value="NEON SKYLINE" maxlength="40">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" value="VICE CITY NIGHTS" maxlength="40">
    </label>
    <fieldset class="sizes">
      <legend>Export size</legend>
      <label><input type="radio" name="size" value="square" checked> Square 1080×1080</label>
      <label><input type="radio" name="size" value="portrait"> Portrait 1080×1350</label>
      <label><input type="radio" name="size" value="landscape"> Landscape 1920×1080</label>
    </fieldset>
    <div class="panel-box" data-panel="0">
      <h3>Panel 1</h3>
      <input type="file" accept="image/*" hidden>
      <button type="button" class="upload">Upload photo</button>
      <button type="button" class="sample">Use sample</button>
      <label>Zoom <input type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input type="range" min="-1" max="1" step="0.05" value="0"></label>
    </div>
    <div class="panel-box" data-panel="1">
      <h3>Panel 2</h3>
      <input type="file" accept="image/*" hidden>
      <button type="button" class="upload">Upload photo</button>
      <button type="button" class="sample">Use sample</button>
      <label>Zoom <input type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input type="range" min="-1" max="1" step="0.05" value="0"></label>
    </div>
    <div class="panel-box" data-panel="2">
      <h3>Panel 3</h3>
      <input type="file" accept="image/*" hidden>
      <button type="button" class="upload">Upload photo</button>
      <button type="button" class="sample">Use sample</button>
      <label>Zoom <input type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input type="range" min="-1" max="1" step="0.05" value="0"></label>
    </div>
    <button type="button" id="fill-all">Use photo 1 for all panels</button>
    <button type="button" id="export">Export PNG</button>
    <a id="download" hidden></a>
    <p class="note">Photos stay on your machine — nothing is uploaded. Fonts: Anton &amp; Oswald (SIL Open Font License).</p>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
