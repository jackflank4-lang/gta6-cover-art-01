<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Lights Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>VICE LIGHTS <span>STUDIO</span></h1>
  <p class="tag">Turn any photo into GTA 6-style cover art. Offline, no upload.</p>
</header>
<main class="layout">
  <section class="stage">
    <canvas id="cover" width="1080" height="1080"></canvas>
    <div class="sizes" role="radiogroup" aria-label="Post size">
      <label><input type="radio" name="size" value="square" checked> Square 1080&times;1080</label>
      <label><input type="radio" name="size" value="portrait"> Portrait 1080&times;1350</label>
      <label><input type="radio" name="size" value="landscape"> Landscape 1920&times;1080</label>
    </div>
  </section>
  <aside class="editor">
    <label class="field">Caption
      <input id="title" type="text" value="VICE LIGHTS" maxlength="40" spellcheck="false">
    </label>
    <label class="field">Subtitle
      <input id="subtitle" type="text" value="Neon Coast" maxlength="40" spellcheck="false">
    </label>
    <div class="panels">
      <div class="panel-box" data-panel="0">
        <h2>Hero panel</h2>
        <button type="button" data-load="hero">Load photo</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
        <input type="file" accept="image/*" hidden>
        <label>Zoom <input type="range" min="1" max="2.5" step="0.01" value="1"></label>
      </div>
      <div class="panel-box" data-panel="1">
        <h2>Side panel</h2>
        <button type="button" data-load="side">Load photo</button>
        <button type="button" data-sample="pier">Sample: Pier</button>
        <input type="file" accept="image/*" hidden>
        <label>Zoom <input type="range" min="1" max="2.5" step="0.01" value="1"></label>
      </div>
      <div class="panel-box" data-panel="2">
        <h2>Bottom panel</h2>
        <button type="button" data-load="bottom">Load photo</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
        <input type="file" accept="image/*" hidden>
        <label>Zoom <input type="range" min="1" max="2.5" step="0.01" value="1"></label>
      </div>
    </div>
    <label class="field">Grade
      <select id="grade">
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon Nights</option>
        <option value="vice">Vice Pink</option>
        <option value="dusk">Dusk Teal</option>
      </select>
    </label>
    <div class="actions">
      <button id="exportBtn" type="button">Export PNG</button>
      <a id="downloadLink" hidden>Download</a>
    </div>
    <p class="hint">Photos stay on your machine. Fonts: Anton (SIL OFL), embedded.</p>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
